<text x="374.00" y="110.50" font-size="2.4" text-anchor="start" font-weight="normal" fill="black" stroke="none">tube wall</text>
<text x="365.00" y="116.00" font-size="2.4" text-anchor="start" font-weight="normal" fill="black" stroke="none">saddle</text>
<text x="12.00" y="241.00" font-size="3.0" text-anchor="start" font-weight="normal" fill="black" stroke="none">Print: FDM in PETG or ASA (PLA softens in a car), or order MJF PA12; the outer face on the bed, no supports.</text>
<text x="12.00" y="246.00" font-size="3.0" text-anchor="start" font-weight="normal" fill="black" stroke="none">No wall thinner than 1.2 mm. The 2.0 mm flange sits on the tube's end, the board's end butts against it.</text>
<text x="12.00" y="251.00" font-size="3.0" text-anchor="start" font-weight="normal" fill="black" stroke="none">Tube 30×30×1.5, 84.9 +0.2/−0 mm long, its ends square and deburred: the board fits between the flanges.</text>
<text x="12.00" y="256.00" font-size="3.0" text-anchor="start" font-weight="normal" fill="black" stroke="none">Fixing: one M2×6 self-tapping screw a cap. A Ø2.2 hole in the tube's wall, Ø1.6 drilled into the block at assembly:</text>
<text x="12.00" y="261.00" font-size="3.0" text-anchor="start" font-weight="normal" fill="black" stroke="none">  ring cap: in the tube's floor, through the hole in the saddle, 4.2 mm from the end, on the axis; far cap: in the tube's top, 3.0 mm from the end, on the axis.</text>
<text x="12.00" y="266.00" font-size="3.0" text-anchor="start" font-weight="normal" fill="black" stroke="none">Fit the ring cap after the board: the slot in its block lets J1's peg through, the block goes under the board.</text>
<text x="12.00" y="271.00" font-size="3.0" text-anchor="start" font-weight="normal" fill="black" stroke="none">Mounting in the car: the tube rests on the two saddles; four screws through the ears, 4.2 mm self-tapping</text>
<text x="12.00" y="276.00" font-size="3.0" text-anchor="start" font-weight="normal" fill="black" stroke="none">  (DIN 7981) or M4, heads up to 8.2 mm. The saddle prints with the cap, a wall from the bed; the ear holes lie horizontal.</text>
<text x="12.00" y="281.00" font-size="3.0" text-anchor="start" font-weight="normal" fill="black" stroke="none">The tube's ground: an M2 ring terminal and a serrated washer under the far cap's screw head; a 3–5 cm wire</text>
<text x="12.00" y="286.00" font-size="3.0" text-anchor="start" font-weight="normal" fill="black" stroke="none">  to J4's harness ground next to the plug (soldered, heat-shrunk). The tube bare, or cleaned to metal under the washer.</text>
</svg>
